<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Fabulous</title>
  <meta name="description" content="Project Fabulous: an AI-based game generator. More information coming soon.">
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1d1b16;
      --muted: #6b665c;
      --accent: #b5431c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f;
        --fg: #efeae0;
        --muted: #a39d90;
        --accent: #f0845a;
      }
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      box-sizing: border-box;
    }
    main { max-width: 36rem; text-align: center; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      margin: 0 0 0.5rem;
    }
    h1 span { color: var(--accent); }
    p { margin: 0.75rem 0; }
    .muted { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Project <span>Fabulous</span></h1>
    <p>More info about Project Fabulous is coming soon.</p>
    <p class="muted">An AI-based game generator, in the making.</p>
  </main>
</body>
</html>
